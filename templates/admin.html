{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Professionals Databank</title>
  <link rel="stylesheet" href="{% static 'shared-layout.css' %}">
  <style>
    .card { background:#111827; border:1px solid rgba(148,163,184,0.12); border-radius:24px; padding:1.5rem; box-shadow:0 20px 60px rgba(15,23,42,0.4); }
    .notice { margin-bottom:1rem; color:#94a3b8; }
    .create-user-section { margin-bottom:1.5rem; }
    .create-user-section h2 { margin-bottom:1rem; color:#e2e8f0; font-size:1.05rem; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-bottom:1rem; }
    .form-grid label { display:flex; flex-direction:column; gap:0.4rem; color:#cbd5e1; font-size:0.9rem; }
    .form-grid input, .form-grid select, .form-grid button {
      border-radius:12px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.7rem 0.85rem;
    }
    .form-grid input { width:100%; }
    .permission-help { margin-bottom:1rem; color:#cbd5e1; font-size:0.95rem; line-height:1.5; }
    .field-with-label { display:flex; flex-direction:column; gap:0.35rem; }
    .field-note { color:#94a3b8; font-size:0.82rem; line-height:1.3; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { padding:0.95rem 0.9rem; text-align:left; border-bottom:1px solid rgba(148,163,184,0.12); font-size:0.95rem; }
    th { color:#cbd5e1; text-transform:uppercase; letter-spacing:0.08em; font-size:0.8rem; }
    td input, td select { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.7rem 0.75rem; }
    select, button { border-radius:12px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.7rem 0.85rem; }
    button.update { background:#22c55e; color:#0f172a; border:none; cursor:pointer; }
    button.update:hover { opacity:0.95; }
    .error { color:#fb7185; margin-top:1rem; }
  </style>
</head>
<body>
  <div id="shared-shell"></div>
  <template id="page-body-template">
    <div class="card">
      <div id="statusText">Loading users...</div>
      <div id="adminError" class="error" style="display:none"></div>
      <div id="createUserSection" class="create-user-section">
        <h2>Create new user</h2>
        <div class="form-grid">
          <label>Name<input type="text" id="newUserName" placeholder="Full name"></label>
          <label>Email<input type="email" id="newUserEmail" placeholder="email@example.com"></label>
          <label>Password<input type="password" id="newUserPassword" placeholder="Set a password"></label>
          <label>Role
            <select id="newUserRole">
              <option value="user">user — Standard access</option>
              <option value="admin">admin — Full administration</option>
            </select>
          </label>
          <label>Status
            <select id="newUserStatus">
              <option value="active">active — Active login</option>
              <option value="pending">pending — Pending approval</option>
              <option value="disabled">disabled — Access blocked</option>
            </select>
          </label>
        </div>
        <button id="createUserButton">Create user</button>
      </div>
      <div class="permission-help">
        <strong>Role meanings:</strong> <em>admin</em> has full user and app management rights; <em>user</em> has standard member access.<br>
        <strong>Status meanings:</strong> <em>active</em> can sign in; <em>pending</em> is awaiting activation; <em>disabled</em> cannot access the system.
      </div>
      <table id="usersTable" style="display:none">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </template>

  <script src="{% static 'shared-layout.js' %}"></script>
  <script>
    const token = localStorage.getItem('authToken');

    const ROLE_LABELS = { admin: 'Administrator (full access)', user: 'Standard user (limited access)' };
    const STATUS_LABELS = { active: 'Active — can sign in', pending: 'Pending — approval needed', disabled: 'Disabled — no access' };

    async function fetchUsers() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to load users');
        renderUsers(data.users);
      } catch (err) {
        document.getElementById('statusText').textContent = 'Unable to load users.';
        const errEl = document.getElementById('adminError');
        errEl.textContent = err.message; errEl.style.display = 'block';
      }
    }

    function renderUsers(users) {
      document.getElementById('statusText').textContent = `${users.length} registered users`;
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = users.map(user => {
        const statuses = ['active','pending','disabled'].map(v =>
          `<option value="${v}" ${user.status===v?'selected':''}>${STATUS_LABELS[v]||v}</option>`).join('');
        const roles = ['user','admin'].map(v =>
          `<option value="${v}" ${user.role===v?'selected':''}>${ROLE_LABELS[v]||v}</option>`).join('');
        return `<tr>
          <td><input type="text" value="${user.name}" data-user-id="${user.id}" data-field="name"/></td>
          <td><input type="email" value="${user.email}" data-user-id="${user.id}" data-field="email"/></td>
          <td><div class="field-with-label"><select data-user-id="${user.id}" data-field="role">${roles}</select><div class="field-note">${ROLE_LABELS[user.role]||user.role}</div></div></td>
          <td><div class="field-with-label"><select data-user-id="${user.id}" data-field="status">${statuses}</select><div class="field-note">${STATUS_LABELS[user.status]||user.status}</div></div></td>
          <td><button class="update" data-user-id="${user.id}">Update</button></td>
        </tr>`;
      }).join('');
      document.getElementById('usersTable').style.display = 'table';
      document.querySelectorAll('button.update').forEach(btn => btn.addEventListener('click', updateUser));
    }

    async function updateUser(event) {
      const userId = event.currentTarget.dataset.userId;
      const row = event.currentTarget.closest('tr');
      const name   = row.querySelector('input[data-field="name"]').value.trim();
      const email  = row.querySelector('input[data-field="email"]').value.trim();
      const role   = row.querySelector('select[data-field="role"]').value;
      const status = row.querySelector('select[data-field="status"]').value;
      try {
        const res = await fetch(`/api/admin/users/${userId}`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, role, status }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Update failed');
        event.currentTarget.textContent = 'Saved';
        setTimeout(() => { event.currentTarget.textContent = 'Update'; }, 1200);
      } catch (err) {
        const errEl = document.getElementById('adminError');
        errEl.textContent = `Failed to update user: ${err.message}`; errEl.style.display = 'block';
      }
    }

    async function createUser() {
      const name     = document.getElementById('newUserName').value.trim();
      const email    = document.getElementById('newUserEmail').value.trim();
      const password = document.getElementById('newUserPassword').value;
      const role     = document.getElementById('newUserRole').value;
      const status   = document.getElementById('newUserStatus').value;
      const errEl    = document.getElementById('adminError');
      errEl.style.display = 'none';
      if (!name || !email || !password) {
        errEl.textContent = 'Name, email, and password are required.';
        errEl.style.display = 'block'; return;
      }
      try {
        const res = await fetch('/api/admin/users', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role, status }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to create user');
        document.getElementById('newUserName').value = '';
        document.getElementById('newUserEmail').value = '';
        document.getElementById('newUserPassword').value = '';
        await fetchUsers();
      } catch (err) {
        errEl.textContent = `Failed to create user: ${err.message}`; errEl.style.display = 'block';
      }
    }

    async function initAdminPage() {
      document.getElementById('createUserButton').addEventListener('click', createUser);
      await fetchUsers();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProtectedPage({
        title: 'Admin console',
        activeHref: 'admin.html',
        contentHtml: document.getElementById('page-body-template').innerHTML,
        onMount: initAdminPage,
      });
    });
  </script>
</body>
</html>
