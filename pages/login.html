<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Professionals Databank</title>
  <style>
    body { margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; background:#0b1320; color:#f8fafc; display:grid; place-items:center; padding:2rem; }
    .auth-header { width:min(1120px,100%); max-width:1120px; display:flex; align-items:center; justify-content:space-between; position:absolute; top:1rem; left:50%; transform:translateX(-50%); padding:0 1.5rem; z-index:10; }
    .brand { color:#f8fafc; font-weight:700; font-size:0.95rem; letter-spacing:0.08em; text-decoration:none; text-transform:uppercase; }
    .brand span { color:#facc15; }
    .auth-links { display:flex; gap:1rem; }
    .auth-links a { color:#f8fafc; text-decoration:none; padding:0.75rem 1rem; border-radius:14px; border:1px solid rgba(148,163,184,0.18); transition:background 0.2s, color 0.2s; }
    .auth-links a:hover { background:rgba(255,255,255,0.08); }
    .panel { width:min(520px,100%); background:#111827; border:1px solid rgba(148,163,184,0.12); border-radius:24px; padding:2.25rem; box-shadow:0 22px 70px rgba(15,23,42,0.45); margin-top:4rem; }
    h1 { margin:0 0 0.75rem; font-size:1.95rem; letter-spacing:-0.03em; }
    p { margin:0 0 1.75rem; color:#94a3b8; line-height:1.7; }
    label { display:block; font-size:0.8rem; margin-bottom:0.35rem; color:#cbd5e1; text-transform:uppercase; letter-spacing:0.1em; }
    input { width:100%; border-radius:14px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.95rem 1rem; font-size:0.95rem; margin-bottom:1.15rem; }
    button { width:100%; border:none; border-radius:14px; background:linear-gradient(135deg,#c49528,#e8b84b); color:#0f172a; padding:1rem 1.1rem; font-weight:700; font-size:0.98rem; cursor:pointer; transition:transform 0.15s, opacity 0.15s; }
    button:hover { opacity:0.95; transform:translateY(-1px); }
    .links { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-top:1rem; font-size:0.9rem; color:#94a3b8; }
    a { color:#f8fafc; text-decoration:none; } a:hover{text-decoration:underline;}
    .error { margin:0 0 1rem; color:#fb7185; font-size:0.95rem; }
  </style>
</head>
<body>
  <header class="auth-header">
    <a class="brand" href="index.html">Professionals <span>Databank</span></a>
    <nav class="auth-links">
      <a href="signup.html">Create account</a>
      <a href="dashboard.html">Preview dashboard</a>
    </nav>
  </header>
  <div class="panel">
    <h1>Member login</h1>
    <p>Access the Professionals Databank securely. Sign in to manage your profile or continue to the admin console if you have permission.</p>
    <div id="error" class="error" style="display:none"></div>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="links">
      <span>New here? <a href="signup.html">Create an account</a></span>
      <span><a href="dashboard.html">View dashboard demo</a></span>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || 'Login failed');
        }
        localStorage.setItem('authToken', body.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
