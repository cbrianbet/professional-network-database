{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Professionals Databank</title>
  <link rel="stylesheet" href="{% static 'shared-layout.css' %}">
  <style>
    .card { background:#111827; border:1px solid rgba(148,163,184,0.12); border-radius:24px; padding:1.5rem; box-shadow:0 20px 60px rgba(15,23,42,0.4); }
    .notice { margin-bottom:1rem; color:#94a3b8; }
    .create-user-section { margin-bottom:1.5rem; }
    .create-user-section h2 { margin-bottom:1rem; color:#e2e8f0; font-size:1.05rem; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-bottom:1rem; }
    .form-grid label { display:flex; flex-direction:column; gap:0.4rem; color:#cbd5e1; font-size:0.9rem; }
    .form-grid input, .form-grid select, .form-grid button {
      border-radius:12px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.7rem 0.85rem;
    }
    .form-grid input { width:100%; }
    .permission-help { margin-bottom:1rem; color:#cbd5e1; font-size:0.95rem; line-height:1.5; }
    .field-with-label { display:flex; flex-direction:column; gap:0.35rem; }
    .field-note { color:#94a3b8; font-size:0.82rem; line-height:1.3; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { padding:0.95rem 0.9rem; text-align:left; border-bottom:1px solid rgba(148,163,184,0.12); font-size:0.95rem; }
    th { color:#cbd5e1; text-transform:uppercase; letter-spacing:0.08em; font-size:0.8rem; }
    td input, td select { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.7rem 0.75rem; }
    select, button { border-radius:12px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.7rem 0.85rem; }
    button.update { background:#22c55e; color:#0f172a; border:none; cursor:pointer; }
    button.update:hover { opacity:0.95; }
    .error { color:#fb7185; margin-top:1rem; }
    .pagination { display:flex; align-items:center; justify-content:space-between; margin-top:1rem; flex-wrap:wrap; gap:0.5rem; }
    .page-info { color:#94a3b8; font-size:0.85rem; }
    .page-btns { display:flex; gap:0.25rem; flex-wrap:wrap; }
    .page-btn {
      min-width:32px; height:32px; padding:0 0.5rem; border-radius:8px;
      border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#cbd5e1;
      font-size:0.85rem; cursor:pointer; transition:all 0.15s;
    }
    .page-btn:hover { border-color:#d4a843; color:#d4a843; }
    .page-btn.active { background:#22c55e; color:#0f172a; border-color:#22c55e; font-weight:700; }
    .link-cell { color:#4a9eff; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .link-cell a { color:#4a9eff; text-decoration:none; }
    .link-cell a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div id="shared-shell"></div>
  <template id="page-body-template">
    <div class="card">
      <div id="statusText">Loading users...</div>
      <div id="adminError" class="error" style="display:none"></div>
      <div id="createUserSection" class="create-user-section">
        <h2>Create new user</h2>
        <div class="form-grid">
          <label>Name<input type="text" id="newUserName" placeholder="Full name"></label>
          <label>Email<input type="email" id="newUserEmail" placeholder="email@example.com"></label>
          <label>Password<input type="password" id="newUserPassword" placeholder="Set a password"></label>
          <label>Role
            <select id="newUserRole">
              <option value="user">user — Standard access</option>
              <option value="admin">admin — Full administration</option>
            </select>
          </label>
          <label>Status
            <select id="newUserStatus">
              <option value="active">active — Active login</option>
              <option value="pending">pending — Pending approval</option>
              <option value="disabled">disabled — Access blocked</option>
            </select>
          </label>
        </div>
        <button id="createUserButton">Create user</button>
      </div>
      <div class="permission-help">
        <strong>Role meanings:</strong> <em>admin</em> has full user and app management rights; <em>user</em> has standard member access.<br>
        <strong>Status meanings:</strong> <em>active</em> can sign in; <em>pending</em> is awaiting activation; <em>disabled</em> cannot access the system.
      </div>
      <table id="usersTable" style="display:none">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pagination" id="usersPagination" style="display:none">
        <div class="page-info" id="usersPageInfo"></div>
        <div class="page-btns" id="usersPageBtns"></div>
      </div>
    </div>

    <div class="card" style="margin-top:2rem">
      <h2 style="color:#e2e8f0;margin-bottom:1rem;font-size:1.05rem">Job Adverts</h2>
      <div id="jobAdvertForm" style="margin-bottom:1.5rem">
        <div class="form-grid">
          <label>Title<input type="text" id="jobTitle" placeholder="e.g. Senior Backend Engineer"></label>
          <label>Company<input type="text" id="jobCompany" placeholder="e.g. Acme Ltd"></label>
          <label>Link (optional)<input type="url" id="jobLink" placeholder="https://..."></label>
          <label>Deadline<input type="date" id="jobDeadline"></label>
          <label>File (PDF / image)
            <input type="file" id="jobFile" accept=".pdf,image/png,image/jpeg,image/jpg">
          </label>
        </div>
        <button id="createJobAdvertBtn" class="update">Post advert</button>
        <div id="jobAdvertError" class="error" style="display:none"></div>
      </div>
      <table id="jobAdvertsTable" style="display:none">
        <thead>
          <tr><th>Title</th><th>Company</th><th>Link</th><th>Deadline</th><th>Type</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pagination" id="jobAdvertsPagination" style="display:none">
        <div class="page-info" id="jobAdvertsPageInfo"></div>
        <div class="page-btns" id="jobAdvertsPageBtns"></div>
      </div>
    </div>
  </template>

  <script src="{% static 'shared-layout.js' %}"></script>
  <script>
    const token = localStorage.getItem('authToken');

    const ROLE_LABELS = { admin: 'Administrator (full access)', user: 'Standard user (limited access)' };
    const STATUS_LABELS = { active: 'Active — can sign in', pending: 'Pending — approval needed', disabled: 'Disabled — no access' };

    /* ── Pagination ──────────────────────────────────────────────────────── */
    const ADMIN_PER_PAGE = 10;
    let usersPage = 1;
    let jobAdvertsPage = 1;
    let ALL_USERS = [];
    let ALL_JOB_ADVERTS = [];

    function paginate(items, page) {
      const pages = Math.ceil(items.length / ADMIN_PER_PAGE) || 1;
      if (page > pages) page = pages;
      if (page < 1) page = 1;
      const slice = items.slice((page - 1) * ADMIN_PER_PAGE, page * ADMIN_PER_PAGE);
      return { slice, page, pages, total: items.length };
    }

    function renderPagination(infoId, btnsId, currentPage, pages, total, goFn) {
      const info = document.getElementById(infoId);
      const btns = document.getElementById(btnsId);
      if (!info || !btns) return;
      info.textContent = `${(currentPage - 1) * ADMIN_PER_PAGE + 1}–${Math.min(currentPage * ADMIN_PER_PAGE, total)} of ${total}`;
      let html = '';
      if (currentPage > 1) html += `<button class="page-btn" onclick="${goFn}(${currentPage - 1})">‹</button>`;
      for (let p = 1; p <= pages; p++) {
        if (pages <= 7 || p === 1 || p === pages || Math.abs(p - currentPage) <= 1)
          html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="${goFn}(${p})">${p}</button>`;
        else if (Math.abs(p - currentPage) === 2)
          html += `<button class="page-btn" style="pointer-events:none">…</button>`;
      }
      if (currentPage < pages) html += `<button class="page-btn" onclick="${goFn}(${currentPage + 1})">›</button>`;
      btns.innerHTML = html;
    }

    async function fetchUsers() {
      try {
        const res = await fetch('/api/admin/users/', {
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to load users');
        renderUsers(data.users);
      } catch (err) {
        document.getElementById('statusText').textContent = 'Unable to load users.';
        const errEl = document.getElementById('adminError');
        errEl.textContent = err.message; errEl.style.display = 'block';
      }
    }

    function renderUsers(users) {
      ALL_USERS = users || [];
      document.getElementById('statusText').textContent = `${ALL_USERS.length} registered users`;
      usersPage = 1;
      renderUsersPage();
      document.getElementById('usersTable').style.display = 'table';
      document.getElementById('usersPagination').style.display = ALL_USERS.length > ADMIN_PER_PAGE ? 'flex' : 'none';
    }

    function renderUsersPage() {
      const { slice, page, pages, total } = paginate(ALL_USERS, usersPage);
      usersPage = page;
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = slice.map(user => {
        const statuses = ['active','pending','disabled'].map(v =>
          `<option value="${v}" ${user.status===v?'selected':''}>${STATUS_LABELS[v]||v}</option>`).join('');
        const roles = ['user','admin'].map(v =>
          `<option value="${v}" ${user.role===v?'selected':''}>${ROLE_LABELS[v]||v}</option>`).join('');
        return `<tr>
          <td><input type="text" value="${user.name}" data-user-id="${user.id}" data-field="name"/></td>
          <td><input type="email" value="${user.email}" data-user-id="${user.id}" data-field="email"/></td>
          <td><div class="field-with-label"><select data-user-id="${user.id}" data-field="role">${roles}</select><div class="field-note">${ROLE_LABELS[user.role]||user.role}</div></div></td>
          <td><div class="field-with-label"><select data-user-id="${user.id}" data-field="status">${statuses}</select><div class="field-note">${STATUS_LABELS[user.status]||user.status}</div></div></td>
          <td><button class="update" data-user-id="${user.id}">Update</button></td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('button.update').forEach(btn => btn.addEventListener('click', updateUser));
      renderPagination('usersPageInfo', 'usersPageBtns', page, pages, total, 'goUsersPage');
    }

    function goUsersPage(p) {
      usersPage = p;
      renderUsersPage();
      document.querySelector('#usersTable').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function updateUser(event) {
      const userId = event.currentTarget.dataset.userId;
      const row = event.currentTarget.closest('tr');
      const name   = row.querySelector('input[data-field="name"]').value.trim();
      const email  = row.querySelector('input[data-field="email"]').value.trim();
      const role   = row.querySelector('select[data-field="role"]').value;
      const status = row.querySelector('select[data-field="status"]').value;
      try {
        const res = await fetch(`/api/admin/users/${userId}/`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, role, status }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Update failed');
        event.currentTarget.textContent = 'Saved';
        setTimeout(() => { event.currentTarget.textContent = 'Update'; }, 1200);
      } catch (err) {
        const errEl = document.getElementById('adminError');
        errEl.textContent = `Failed to update user: ${err.message}`; errEl.style.display = 'block';
      }
    }

    async function createUser() {
      const name     = document.getElementById('newUserName').value.trim();
      const email    = document.getElementById('newUserEmail').value.trim();
      const password = document.getElementById('newUserPassword').value;
      const role     = document.getElementById('newUserRole').value;
      const status   = document.getElementById('newUserStatus').value;
      const errEl    = document.getElementById('adminError');
      errEl.style.display = 'none';
      if (!name || !email || !password) {
        errEl.textContent = 'Name, email, and password are required.';
        errEl.style.display = 'block'; return;
      }
      try {
        const res = await fetch('/api/admin/users/', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role, status }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to create user');
        document.getElementById('newUserName').value = '';
        document.getElementById('newUserEmail').value = '';
        document.getElementById('newUserPassword').value = '';
        usersPage = 1;
        await fetchUsers();
      } catch (err) {
        errEl.textContent = `Failed to create user: ${err.message}`; errEl.style.display = 'block';
      }
    }

    async function fetchJobAdverts() {
      try {
        const res = await fetch('/api/job-adverts/', {
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to load job adverts');
        renderJobAdverts(data.job_adverts);
      } catch (err) {
        const errEl = document.getElementById('jobAdvertError');
        errEl.textContent = err.message; errEl.style.display = 'block';
      }
    }

    function fileTypeFromExt(name) {
      const lower = (name || '').toLowerCase();
      if (lower.endsWith('.pdf')) return 'pdf';
      if (lower.endsWith('.jpg') || lower.endsWith('.jpeg')) return 'jpeg';
      if (lower.endsWith('.png')) return 'png';
      return null;
    }

    async function createJobAdvert() {
      const title = document.getElementById('jobTitle').value.trim();
      const company = document.getElementById('jobCompany').value.trim();
      const link = document.getElementById('jobLink').value.trim();
      const deadline = document.getElementById('jobDeadline').value || null;
      const fileInput = document.getElementById('jobFile');
      const errEl = document.getElementById('jobAdvertError');
      errEl.style.display = 'none';

      if (!title || !company) {
        errEl.textContent = 'Title and company are required.';
        errEl.style.display = 'block'; return;
      }

      const hasFile = fileInput.files.length > 0;
      let fileId = null;
      let fileType = '';

      if (hasFile) {
        const file = fileInput.files[0];
        fileType = fileTypeFromExt(file.name);
        if (!fileType) {
          errEl.textContent = 'Only PDF, PNG, and JPG files are allowed.';
          errEl.style.display = 'block'; return;
        }

        // Upload the file to the existing file-resources endpoint
        const fd = new FormData();
        fd.append('file', file);
        fd.append('file_type', fileType);
        fd.append('original_filename', file.name);
        fd.append('file_size', file.size);
        fd.append('upload_path', '');  // server computes
        fd.append('permission_level', 'authenticated');
        const uploadRes = await fetch('/api/admin/file-resources/', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok) throw new Error(uploadData.error || 'File upload failed');
        fileId = uploadData.id;
      }

      // Create the advert (file is optional — link-only adverts are allowed)
      const res = await fetch('/api/job-adverts/create/', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, company, link, deadline, file_id: fileId, file_type: fileType }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Unable to create advert');

        // Clear form
        document.getElementById('jobTitle').value = '';
        document.getElementById('jobCompany').value = '';
        document.getElementById('jobLink').value = '';
        document.getElementById('jobDeadline').value = '';
        document.getElementById('jobFile').value = '';
        jobAdvertsPage = 1;
        await fetchJobAdverts();
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
      }
    }

    function renderJobAdverts(adverts) {
      ALL_JOB_ADVERTS = adverts || [];
      jobAdvertsPage = 1;
      renderJobAdvertsPage();
      document.getElementById('jobAdvertsTable').style.display = 'table';
      document.getElementById('jobAdvertsPagination').style.display = ALL_JOB_ADVERTS.length > ADMIN_PER_PAGE ? 'flex' : 'none';
    }

    function renderJobAdvertsPage() {
      const { slice, page, pages, total } = paginate(ALL_JOB_ADVERTS, jobAdvertsPage);
      jobAdvertsPage = page;
      const tbody = document.querySelector('#jobAdvertsTable tbody');
      tbody.innerHTML = slice.map(a => {
        const linkCell = a.link
          ? `<td class="link-cell"><a href="${a.link}" target="_blank" rel="noopener">${a.link}</a></td>`
          : `<td>—</td>`;
        const type = (a.file_type || '').toUpperCase();
        return `<tr>
          <td>${a.title}</td>
          <td>${a.company}</td>
          ${linkCell}
          <td>${a.deadline || '—'}</td>
          <td>${type || '—'}</td>
          <td><button class="update" data-job-id="${a.id}">Delete</button></td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('button[data-job-id]').forEach(btn =>
        btn.addEventListener('click', () => deleteJobAdvert(btn.dataset.jobId))
      );
      renderPagination('jobAdvertsPageInfo', 'jobAdvertsPageBtns', page, pages, total, 'goJobAdvertsPage');
    }

    function goJobAdvertsPage(p) {
      jobAdvertsPage = p;
      renderJobAdvertsPage();
      document.querySelector('#jobAdvertsTable').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function deleteJobAdvert(id) {
      if (!confirm('Delete this job advert?')) return;
      try {
        const res = await fetch(`/api/job-adverts/${id}/`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || 'Delete failed');
        }
        await fetchJobAdverts();
      } catch (err) {
        const errEl = document.getElementById('jobAdvertError');
        errEl.textContent = err.message; errEl.style.display = 'block';
      }
    }

    async function initAdminPage() {
      document.getElementById('createUserButton').addEventListener('click', createUser);
      document.getElementById('createJobAdvertBtn').addEventListener('click', createJobAdvert);
      await fetchUsers();
      await fetchJobAdverts();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProtectedPage({
        title: 'Admin console',
        activeHref: 'admin.html',
        contentHtml: document.getElementById('page-body-template').innerHTML,
        onMount: initAdminPage,
      });
    });
  </script>
</body>
</html>
