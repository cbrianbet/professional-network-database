<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Professionals Databank</title>
  <style>
    body { margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; background:#0b1320; color:#f8fafc; display:grid; place-items:center; padding:2rem; }
    .auth-header { width:min(1120px,100%); display:flex; align-items:center; justify-content:space-between; position:absolute; top:1rem; left:50%; transform:translateX(-50%); padding:0 1.5rem; z-index:10; }
    .brand { color:#f8fafc; font-weight:700; font-size:0.95rem; letter-spacing:0.08em; text-decoration:none; text-transform:uppercase; }
    .brand span { color:#facc15; }
    .panel { width:min(540px,100%); background:#111827; border:1px solid rgba(148,163,184,0.12); border-radius:24px; padding:2.25rem; box-shadow:0 22px 70px rgba(15,23,42,0.45); margin-top:4rem; }
    h1 { margin:0 0 0.75rem; font-size:1.95rem; letter-spacing:-0.03em; }
    p { margin:0 0 1.75rem; color:#94a3b8; line-height:1.7; }
    label { display:block; font-size:0.8rem; margin-bottom:0.35rem; color:#cbd5e1; text-transform:uppercase; letter-spacing:0.1em; }
    input { width:100%; border-radius:14px; border:1px solid rgba(148,163,184,0.18); background:#0f172a; color:#f8fafc; padding:0.95rem 1rem; font-size:0.95rem; margin-bottom:1.15rem; outline:none; box-sizing:border-box; }
    button { width:100%; border:none; border-radius:14px; background:linear-gradient(135deg,#c49528,#e8b84b); color:#0f172a; padding:1rem; font-weight:700; font-size:0.98rem; cursor:pointer; transition:transform 0.15s,opacity 0.15s; }
    button:hover { opacity:0.95; transform:translateY(-1px); }
    .links { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-top:1rem; font-size:0.9rem; color:#94a3b8; }
    a { color:#f8fafc; text-decoration:none; }
    a:hover { text-decoration:underline; }
    /* ── App Overlay ────────────────────────────── */
    .app-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15, 25, 35, 0.65);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .app-overlay.show { display: flex; }
    .app-overlay-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(15, 25, 35, 0.45);
      animation: appOverlayPopIn 0.35s cubic-bezier(.175, .885, .32, 1.275);
    }
    @keyframes appOverlayPopIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    .app-overlay-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }
    .app-overlay-card.error .app-overlay-icon { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .app-overlay-card.success .app-overlay-icon { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .app-overlay-card h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: #1e293b;
    }
    .app-overlay-card p {
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .app-overlay-actions {
      margin-top: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .app-overlay-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      border-radius: 10px;
      padding: 0.72rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .app-overlay-btn:active { transform: scale(0.97); }
    .app-overlay-btn.primary {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
    }
    .app-overlay-btn.primary:hover { background: #334155; }
    @media (max-width: 600px) {
      .app-overlay-card { padding: 2rem 1.5rem; }
      .app-overlay-icon { width: 56px; height: 56px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <header class="auth-header">
    <a class="brand" href="/">Professionals <span>Databank</span></a>
  </header>
  <div class="panel">
    <h1>Create your account</h1>
    <p>Join the Professionals Databank and build your profile. Admins can moderate entries from the admin console.</p>
    <form id="signupForm">
      <label for="name">Full Name</label>
      <input id="name" type="text" required>
      <label for="email">Email address</label>
      <input id="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" required>
      <button type="submit">Create account</button>
    </form>
    <div class="links">
      <span>Already have an account? <a href="/login">Sign in</a></span>
    </div>
  </div>
  <script>
    // ── App Overlay ──────────────────────────────
    window.AppOverlay = (function() {
      function getOverlay() {
        let el = document.getElementById('appOverlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'appOverlay';
          el.className = 'app-overlay';
          document.body.appendChild(el);
        }
        return el;
      }
      return {
        show({ type, title, message, actions }) {
          const el = getOverlay();
          const icons = { success: '✓', error: '✕', confirm: '?' };
          const iconLetters = icons[type] || '!';
          const actionBtns = (actions || []).map((a, i) => {
            const cls = a.class || (i === 0 ? 'primary' : 'secondary');
            return `<button class="app-overlay-btn ${cls}" data-idx="${i}">${a.label}</button>`;
          }).join('');
          el.innerHTML = `<div class="app-overlay-card ${type}">
            <div class="app-overlay-icon">${iconLetters}</div>
            <h3>${title}</h3>
            <p style="white-space:pre-wrap">${message}</p>
            <div class="app-overlay-actions">${actionBtns}</div>
          </div>`;
          el.querySelectorAll('.app-overlay-btn').forEach(btn => {
            const idx = parseInt(btn.dataset.idx);
            btn.addEventListener('click', () => {
              if (actions && actions[idx] && actions[idx].onClick) actions[idx].onClick();
            });
          });
          // force reflow then show
          void el.offsetWidth;
          el.classList.add('show');
          el.onclick = (e) => { if (e.target === el) this.hide(); };
        },
        hide() {
          const el = document.getElementById('appOverlay');
          if (el) el.classList.remove('show');
        },
        success(title, message, closeLabel) {
          closeLabel = closeLabel || 'OK';
          this.show({ type: 'success', title, message, actions: [{ label: closeLabel, onClick: () => this.hide() }] });
        },
        error(title, message, closeLabel) {
          closeLabel = closeLabel || 'Dismiss';
          this.show({ type: 'error', title, message, actions: [{ label: closeLabel, onClick: () => this.hide() }] });
        },
        confirm(title, message) {
          return new Promise(resolve => {
            this.show({
              type: 'confirm', title, message,
              actions: [
                { label: 'Cancel', class: 'secondary', onClick: () => { this.hide(); resolve(false); } },
                { label: 'Confirm', class: 'primary', onClick: () => { this.hide(); resolve(true); } },
              ]
            });
          });
        }
      };
    })();

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/auth/signup/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Signup failed');
        localStorage.setItem('authToken', body.token);
        window.location.href = '/dashboard';
      } catch (err) {
        AppOverlay.error('Sign Up Failed', err.message);
      }
    });
  </script>
</body>
</html>
